; Android export scaffolding. This config is reviewable here, but producing
; an actual APK/AAB requires the Android SDK, a Godot Android export template
; (gdextension/gradle build), and a keystore — none of which are available in
; this sandboxed environment. Opening this project in a real Godot 4.3+
; editor with Android build tools installed (Editor Settings > Export >
; Android) is a manual step outside this session; this file gets the preset
; itself ready so that step is just "press Export" rather than "configure
; from scratch."

