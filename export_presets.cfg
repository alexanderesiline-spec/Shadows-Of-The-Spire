; Android export scaffolding. This config is reviewable here, but producing
; an actual APK/AAB requires the Android SDK, a Godot Android export template
; (gradle build), and a keystore — none of which are available in this
; sandboxed environment. Opening this project in a real Godot 4.6.3 editor
; with Android build tools installed (Editor Settings > Export > Android) is
; a manual step outside this session; this file gets the preset itself ready
; so that step is just "press Export" rather than "configure from scratch."
;
; Keys verified against the Godot 4.6 Android export plugin source
; (platform/android/export/export_plugin.cpp) rather than carried forward
; from 4.3-era assumptions — gradle_build/min_sdk, gradle_build/target_sdk,
; gradle_build/compress_native_libraries, and several package/* keys
; (exclude_from_recents, show_in_android_tv, show_in_app_library,
; show_as_launcher_app) are new since the version this project originally
; targeted. Screen orientation is no longer a preset option at all — it moved
; to the project-wide setting display/window/handheld/orientation (set in
; project.godot) and is read from there directly by the exporter.

